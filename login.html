<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logeo</title>
    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="contenedor">
        <h1>Inicio de Sesión</h1>
        <p class="subtitulo">Ingresa tus datos</p>

        <form class="formulario" id="formulario">
            <div class="grupo">
                <label for="correo">Correo electronico</label>
                <input type="text" id="correo" placeholder="Ejemplo@email.com" >
            </div>
            <div class="grupo">
                <label for="mensaje">Contraseña</label>
                <input type="password" id="contrasena" placeholder="" >
                <p id="mensaje" class="alerta"></p>
            </div>
            <button type="submit" onclick="validarLogin()" class="boton">
                Iniciar Sesión <span>→</span>
            </button>
        </form>
    </div>

</body>
</html>
