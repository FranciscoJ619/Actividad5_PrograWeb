<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- Contenedor general del layout -->
  <div class="layout">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Panel Escolar</h2>
      </div>

      <nav class="sidebar-menu">
        <ul>
          <!-- Menú Usuarios con submenú desplegable -->
          <li class="menu-item has-submenu">
            <button class="submenu-btn" id="btnMenuUsuarios">
              <span>Usuarios</span>
              <span class="arrow">▾</span>
            </button>
            <ul class="submenu" id="submenuUsuarios">
              <li><a href="#" id="linkMenuUsuarios">Captura de Usuario</a></li>
            </ul>
          </li>
          <!-- Enlace directo al formulario de alumnos -->
          <li class="menu-item">
            <a href="#" class="menu-link" id="linkMenuAlumnos">Alumnos</a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- ÁREA PRINCIPAL DE CONTENIDO -->
    <div class="main-wrapper">

      <!-- BARRA SUPERIOR (NAVBAR) -->
      <header class="navbar">
        <!-- Botón hamburguesa para colapsar/abrir sidebar -->
        <button class="btn-toggle" id="btnToggleSidebar" aria-label="Abrir o cerrar menú">
          ☰
        </button>

        <!-- Menú de usuario a la derecha -->
        <div class="user-menu-container">
          <button class="user-btn" id="btnUserMenu">
            <!-- Aquí JS colocará el nombre o correo del login -->
            <span id="userNameDisplay">Usuario Activo</span>
            <span class="arrow">▾</span>
          </button>
          
          <!-- Desplegable para cerrar sesión -->
          <div class="user-dropdown" id="userDropdown">
            <a href="login.html" id="btnLogout">Cerrar sesión</a>
          </div>
        </div>
      </header>

      <!-- CONTENIDO DE LA PÁGINA -->
      <main class="content">

        <!-- Mensaje inicial de bienvenida -->
        <section class="card mensaje-bienvenida" id="seccion-bienvenida">
          <h3>Bienvenido al Sistema</h3>
          <p>Seleccione una opción del menú lateral (<strong>Usuarios</strong> o <strong>Alumnos</strong>) para comenzar a capturar datos.</p>
        </section>

        <!-- 1. Formulario de Usuarios (Captura) - Inicia oculto -->
        <section class="card oculto" id="seccion-usuarios">
          <h3>Captura de Usuario</h3>
          
          <form id="formUsuario">
            <div class="form-group">
              <label for="nombreUsuario">Nombre de usuario:</label>
              <input type="text" id="nombreUsuario" name="nombreUsuario" placeholder="Ej. jperez" required>
            </div>

            <div class="form-group">
              <label for="correoUsuario">Correo electrónico:</label>
              <input type="email" id="correoUsuario" name="correoUsuario" placeholder="usuario@correo.com" required>
            </div>

            <div class="form-group">
              <label for="passwordUsuario">Contraseña:</label>
              <input type="password" id="passwordUsuario" name="passwordUsuario" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Registrar Usuario</button>
          </form>
        </section>

        <!-- 2. Formulario de Alumnos - Inicia oculto -->
        <section class="card oculto" id="seccion-alumnos">
          <h3>Registro de Alumnos</h3>

          <form id="formAlumno">
            <div class="form-group">
              <label for="numControl">Número de Control (6 dígitos):</label>
              <input type="text" id="numControl" name="numControl" maxlength="6" placeholder="123456" required>
            </div>

            <div class="form-group">
              <label for="nombreAlumno">Nombre completo:</label>
              <input type="text" id="nombreAlumno" name="nombreAlumno" placeholder="Nombre del alumno" required>
            </div>

            <div class="form-group">
              <label for="edadAlumno">Fecha de Nacimiento:</label>
              <input type="date" id="edadAlumno" name="edadAlumno" required>
            </div>

            <button type="submit" class="btn btn-secondary">Comprobar y Registrar</button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <!-- MODAL: Verificación de Mayoría de Edad -->
  <div class="modal-overlay" id="modalEdad">
    <div class="modal-box">
      <h4 id="modalTitulo">Resultado de Edad</h4>
      <p id="modalMensaje">El alumno es mayor de edad.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnCerrarModal">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="js/utileria.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
